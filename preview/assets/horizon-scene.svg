<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 760" role="img" aria-labelledby="title desc">
  <title id="title">Animated horizon garden</title>
  <desc id="desc">A bright cel-shaded landscape with a sunrise portal, floating garden, rolling hills, drifting clouds, orbiting idea seeds, flowers, and petals.</desc>
  <defs>
    <linearGradient id="skyWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fdff"/><stop offset=".42" stop-color="#b9e6ff"/><stop offset="1" stop-color="#7ec8f3"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5ad"/><stop offset="1" stop-color="#ffc85a"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6c6"/><stop offset="1" stop-color="#86c4a7"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76c993"/><stop offset="1" stop-color="#3f9f7e"/>
    </linearGradient>
    <linearGradient id="islandTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8f59a"/><stop offset=".55" stop-color="#89dc79"/><stop offset="1" stop-color="#54bd86"/>
    </linearGradient>
    <linearGradient id="islandUnder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6580c7"/><stop offset="1" stop-color="#564a9f"/>
    </linearGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#d5efff"/><stop offset="1" stop-color="#ffe39a"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#285b76" flood-opacity=".24"/>
    </filter>
    <filter id="sunBlur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
    <symbol id="flower" viewBox="-32 -38 64 96">
      <path d="M0 54C2 34 4 18 2 0" fill="none" stroke="#2e845f" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(2 0)">
        <ellipse rx="9" ry="21" transform="rotate(0) translate(0 -15)" fill="currentColor" stroke="#324e66" stroke-width="3"/>
        <ellipse rx="9" ry="21" transform="rotate(72) translate(0 -15)" fill="currentColor" stroke="#324e66" stroke-width="3"/>
        <ellipse rx="9" ry="21" transform="rotate(144) translate(0 -15)" fill="currentColor" stroke="#324e66" stroke-width="3"/>
        <ellipse rx="9" ry="21" transform="rotate(216) translate(0 -15)" fill="currentColor" stroke="#324e66" stroke-width="3"/>
        <ellipse rx="9" ry="21" transform="rotate(288) translate(0 -15)" fill="currentColor" stroke="#324e66" stroke-width="3"/>
        <circle r="10" fill="#fff1a2" stroke="#324e66" stroke-width="3"/>
      </g>
    </symbol>
    <style>
      #cloudFar{animation:cloudFar 30s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
      #cloudNear{animation:cloudNear 22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
      #sun{animation:sun 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      #orbit{animation:orbit 18s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .seed{animation:seed 9s linear infinite;transform-box:fill-box;transform-origin:center}.seed.two{animation-duration:12s;animation-direction:reverse}.seed.three{animation-duration:7.5s}
      #garden{animation:garden 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      #tree{animation:tree 5.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
      .flower-a{animation:flowerA 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}.flower-b{animation:flowerB 4.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
      .petal{transform-box:fill-box;transform-origin:center}.p1{animation:p1 9s ease-in-out infinite}.p2{animation:p2 11s ease-in-out infinite 1.2s}.p3{animation:p3 8s ease-in-out infinite .4s}.p4{animation:p4 10s ease-in-out infinite 2s}
      .breeze{stroke-dasharray:40 180;stroke-dashoffset:220;animation:breeze 5s linear infinite}.breeze.late{animation-delay:1.8s}
      @keyframes cloudFar{from{transform:translate(-18px,0)}to{transform:translate(24px,-5px)}}
      @keyframes cloudNear{from{transform:translate(15px,2px)}to{transform:translate(-28px,-7px)}}
      @keyframes sun{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
      @keyframes orbit{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(4deg) translateY(-8px)}}
      @keyframes seed{to{rotate:360deg}}
      @keyframes garden{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-12px) rotate(.7deg)}}
      @keyframes tree{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(4.5deg)}}
      @keyframes flowerA{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
      @keyframes flowerB{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-8deg)}}
      @keyframes p1{0%,100%{transform:translate(0,0) rotate(0);opacity:.45}50%{transform:translate(84px,42px) rotate(170deg);opacity:1}}
      @keyframes p2{0%,100%{transform:translate(0,0) rotate(0);opacity:.5}50%{transform:translate(-74px,54px) rotate(-160deg);opacity:1}}
      @keyframes p3{0%,100%{transform:translate(0,0) rotate(0);opacity:.4}50%{transform:translate(-65px,62px) rotate(190deg);opacity:1}}
      @keyframes p4{0%,100%{transform:translate(0,0) rotate(0);opacity:.3}50%{transform:translate(74px,-34px) rotate(180deg);opacity:.9}}
      @keyframes breeze{to{stroke-dashoffset:-220}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="920" height="760" rx="42" fill="url(#skyWash)"/>
  <g id="sun">
    <circle cx="674" cy="176" r="105" fill="#fff7b6" opacity=".34" filter="url(#sunBlur)"/>
    <circle cx="674" cy="176" r="68" fill="url(#sunGlow)" stroke="#314d65" stroke-width="4"/>
    <path d="M674 77V42M674 310v-35M575 176h-35M808 176h-35M604 106l-25-25M769 271l-25-25M744 106l25-25M579 271l25-25" stroke="#ffe073" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g id="cloudFar" fill="#fafdff" stroke="#5f8197" stroke-width="3" opacity=".75">
    <path d="M52 166c12-24 38-31 57-18 12-31 57-34 71-4 28-10 52 8 53 32H52Z"/>
    <path d="M716 300c13-23 42-27 58-11 12-31 59-32 71 2 27-9 49 9 50 31H716Z"/>
  </g>
  <g id="cloudNear" fill="#fff" stroke="#5f8197" stroke-width="3.5">
    <path d="M84 256c16-31 51-38 76-18 17-42 79-42 95 2 38-10 70 13 71 46H84Z"/>
    <path d="M658 112c10-20 34-26 50-12 12-29 55-31 68-1 28-8 51 11 51 35H658Z"/>
  </g>

  <path d="M0 478C128 391 241 429 342 382c91-42 176-27 269 18 102 49 184 23 309-41v401H0Z" fill="url(#hillFar)" stroke="#355f67" stroke-width="4"/>
  <path d="M0 558c123-76 225-41 333-74 105-33 172-17 274 38 119 64 221 17 313-44v282H0Z" fill="url(#hillNear)" stroke="#274e59" stroke-width="4"/>
  <path d="M0 647c161-57 264-22 383-49 138-31 245 3 334 53 73 40 134 31 203 2v107H0Z" fill="#2f8e72" stroke="#274e59" stroke-width="4"/>

  <g transform="translate(604 367)"><g id="orbit">
    <ellipse rx="196" ry="88" fill="none" stroke="#2f5270" stroke-width="3" opacity=".5"/>
    <ellipse rx="160" ry="68" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="10 15" opacity=".9"/>
    <g transform="translate(196 0)"><circle r="17" fill="#ffcc68" stroke="#2f5270" stroke-width="4"/><path d="M-5 2c6-11 15-11 20-1-8 7-14 8-20 1Z" fill="#fff4bc"/></g>
    <g transform="translate(-132 -55)"><circle r="14" fill="#8771df" stroke="#2f5270" stroke-width="4"/><circle r="5" fill="#efeaff"/></g>
    <g transform="translate(70 76)"><circle r="13" fill="#62cba0" stroke="#2f5270" stroke-width="4"/><path d="M0-8v16M-8 0H8" stroke="#ecfff7" stroke-width="3" stroke-linecap="round"/></g>
  </g></g>

  <g filter="url(#softShadow)">
    <path d="M474 454c0-116 58-218 130-218s130 102 130 218" fill="none" stroke="#2c4f67" stroke-width="38" stroke-linecap="round"/>
    <path d="M474 454c0-116 58-218 130-218s130 102 130 218" fill="none" stroke="url(#portal)" stroke-width="29" stroke-linecap="round"/>
    <path d="M497 444c5-91 50-168 107-168s102 77 107 168" fill="#b9e7ff" opacity=".46"/>
  </g>

  <g id="garden" filter="url(#softShadow)">
    <path d="M402 475c47-60 124-88 207-77 78 10 143 49 179 106-46 54-119 85-202 82-83-2-148-39-184-111Z" fill="url(#islandTop)" stroke="#294f5d" stroke-width="5"/>
    <path d="M402 475c35 73 102 116 188 121 82 4 156-29 198-92-44 132-98 194-185 198-89 5-155-57-201-227Z" fill="url(#islandUnder)" stroke="#294f5d" stroke-width="5"/>
    <path d="M458 474c30-35 83-56 143-53 51 2 99 21 132 53-41-12-80-8-119 14-51 28-101 26-156-14Z" fill="#eaf9a9" opacity=".82"/>
    <g transform="translate(650 384)"><g id="tree">
      <path d="M0 93c-4-39 1-74 12-102" stroke="#6a4a37" stroke-width="13" stroke-linecap="round"/>
      <path d="M9 24c-34 1-50-31-32-53 7-29 45-35 61-12 29-5 49 24 35 47-11 25-42 30-64 18Z" fill="#6dcc78" stroke="#294f5d" stroke-width="5"/>
      <path d="M-2-16c10-17 31-21 45-10" stroke="#b8ef83" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    </g></g>
    <g transform="translate(522 460)"><g class="flower-a" style="color:#ff8eb5"><use href="#flower" x="-32" y="-38" width="64" height="96"/></g></g>
    <g transform="translate(731 487) scale(.78)"><g class="flower-b" style="color:#8a78e8"><use href="#flower" x="-32" y="-38" width="64" height="96"/></g></g>
    <g fill="#fff5a5" stroke="#315264" stroke-width="2.5"><circle cx="564" cy="490" r="7"/><circle cx="598" cy="466" r="6"/><circle cx="687" cy="454" r="7"/><circle cx="751" cy="510" r="6"/><circle cx="478" cy="507" r="5"/></g>
  </g>

  <g transform="translate(50 658) scale(1.15)"><g class="flower-a" style="color:#ff8ab7"><use href="#flower" x="-32" y="-38" width="64" height="96"/></g></g>
  <g transform="translate(116 696) scale(.82)"><g class="flower-b" style="color:#8c79e8"><use href="#flower" x="-32" y="-38" width="64" height="96"/></g></g>
  <g transform="translate(202 652)"><g class="flower-a" style="color:#ffd16d"><use href="#flower" x="-32" y="-38" width="64" height="96"/></g></g>
  <g transform="translate(800 671)"><g class="flower-b" style="color:#ff8ab7"><use href="#flower" x="-32" y="-38" width="64" height="96"/></g></g>
  <g transform="translate(866 712) scale(.76)"><g class="flower-a" style="color:#8c79e8"><use href="#flower" x="-32" y="-38" width="64" height="96"/></g></g>

  <g>
    <path class="petal p1" d="M122 318c15-12 25-9 31 3-13 13-24 12-31-3Z" fill="#ff94b9"/>
    <path class="petal p2" d="M338 236c13-10 24-7 29 4-11 12-21 10-29-4Z" fill="#8976e4"/>
    <path class="petal p3" d="M770 245c14-11 25-8 31 4-12 12-23 10-31-4Z" fill="#ffd06b"/>
    <path class="petal p4" d="M286 555c12-9 21-6 26 4-10 10-20 8-26-4Z" fill="#fff"/>
  </g>
  <path class="breeze" d="M70 608c64-52 117-56 167-13" fill="none" stroke="#fff6bc" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <path class="breeze late" d="M690 603c63-40 115-39 160-4" fill="none" stroke="#d9f4ff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
</svg>
